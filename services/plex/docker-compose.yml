version: '3.8'

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - VERSION=docker
    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - ~/Midia/Filmes:/data/movies
      - ~/Midia/Series:/data/tvshows
    restart: unless-stopped
